<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sewa Setu | Branding QC Panel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { min-height: 100vh; margin: 0; padding: 28px 14px 48px; color: #1e293b; background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%); }
    .page-shell { width: min(1180px, 100%); margin: auto; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 24px 28px; color: #fff; border: 1px solid rgba(255,255,255,.18); border-radius: 18px; background: rgba(255,255,255,.1); box-shadow: 0 18px 42px rgba(0,0,0,.18); backdrop-filter: blur(10px); }
    .eyebrow { margin: 0 0 5px; color: #bfdbfe; font-size: .76rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(1.35rem, 3vw, 2rem); font-weight: 700; }
    .topbar p { margin: 6px 0 0; color: #e2e8f0; font-size: .9rem; }
    .brand-mark { display: grid; width: 54px; height: 54px; flex: 0 0 54px; place-items: center; border: 1px solid rgba(255,255,255,.38); border-radius: 16px; color: #fff; font-size: 1.2rem; font-weight: 700; background: rgba(255,255,255,.14); }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin: 20px 0 14px; padding: 14px 16px; border-radius: 14px; background: rgba(255,255,255,.96); box-shadow: 0 12px 30px rgba(0,0,0,.14); }
    .toolbar-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .toolbar label { margin: 0; color: #475569; font-size: .84rem; font-weight: 600; }
    .form-select { min-width: 155px; border-radius: 9px; border-color: #cbd5e1; }
    .summary { color: #64748b; font-size: .84rem; font-weight: 600; }
    .btn-refresh { padding: 9px 14px; border: 0; border-radius: 9px; color: #fff; font-size: .84rem; font-weight: 600; background: linear-gradient(90deg,#003366,#0055a5); }
    .notice { display: none; margin-bottom: 14px; padding: 12px 16px; border-radius: 10px; font-size: .9rem; font-weight: 600; }
    .notice.success { display: block; color: #166534; background: #dcfce7; }
    .notice.error { display: block; color: #991b1b; background: #fee2e2; }
    .queue { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 16px; }
    .qc-card { min-width: 0; overflow: hidden; border: 1px solid #e2e8f0; border-radius: 15px; background: #fff; box-shadow: 0 12px 28px rgba(0,0,0,.16); }
    .photo-wrap { position: relative; display: grid; min-height: 245px; max-height: 390px; place-items: center; overflow: hidden; background: #e2e8f0; }
    .photo-wrap img { display: block; width: 100%; height: 100%; max-height: 390px; object-fit: contain; background: #e2e8f0; }
    .photo-placeholder { padding: 32px 16px; color: #64748b; text-align: center; }
    .photo-open { position: absolute; right: 12px; bottom: 12px; padding: 7px 10px; border-radius: 8px; color: #0f172a; text-decoration: none; font-size: .78rem; font-weight: 600; background: rgba(255,255,255,.94); }
    .card-body { padding: 17px; }
    .card-heading { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
    .card-heading h2 { margin: 0; color: #0f2f53; font-size: 1rem; font-weight: 700; overflow-wrap: anywhere; }
    .card-heading p { margin: 4px 0 0; color: #64748b; font-size: .82rem; }
    .status-badge { flex: 0 0 auto; padding: 5px 10px; border-radius: 999px; font-size: .72rem; font-weight: 700; }
    .status-badge.pending { color: #92400e; background: #fef3c7; }
    .status-badge.approved { color: #166534; background: #dcfce7; }
    .status-badge.rejected { color: #991b1b; background: #fee2e2; }
    .details { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; margin: 0 0 13px; }
    .detail { min-width: 0; }
    .detail-label { display: block; color: #94a3b8; font-size: .68rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    .detail-value { display: block; margin-top: 2px; color: #334155; font-size: .82rem; overflow-wrap: anywhere; }
    .existing-remark { margin: 10px 0; padding: 9px 11px; border-left: 3px solid #f59e0b; border-radius: 5px; color: #713f12; font-size: .8rem; background: #fffbeb; white-space: pre-wrap; }
    .remark-label { margin: 12px 0 5px; color: #475569; font-size: .78rem; font-weight: 600; }
    .remark-input { width: 100%; min-height: 70px; resize: vertical; border: 1px solid #cbd5e1; border-radius: 9px; padding: 9px 11px; color: #334155; font-size: .82rem; }
    .remark-input:focus { outline: 0; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
    .card-actions { display: flex; gap: 9px; margin-top: 10px; }
    .action-btn { flex: 1; padding: 9px 12px; border: 0; border-radius: 9px; color: #fff; font-size: .82rem; font-weight: 700; }
    .approve-btn { background: linear-gradient(90deg,#15803d,#16a34a); }
    .reject-btn { background: linear-gradient(90deg,#b91c1c,#dc2626); }
    .action-btn:disabled, .btn-refresh:disabled { cursor: wait; opacity: .55; }
    .loading, .empty { padding: 42px 18px; border-radius: 14px; color: #475569; text-align: center; font-weight: 600; background: #fff; box-shadow: 0 12px 30px rgba(0,0,0,.14); }
    .pager { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 20px; color: #fff; font-size: .85rem; font-weight: 600; }
    .pager button { padding: 8px 13px; border: 1px solid rgba(255,255,255,.38); border-radius: 8px; color: #fff; background: rgba(255,255,255,.12); }
    .pager button:disabled { opacity: .4; }
    @media(max-width:800px) { .queue { grid-template-columns: 1fr; } }
    @media(max-width:560px) { body { padding: 14px 10px 30px; } .topbar { padding: 19px; } .toolbar { align-items: flex-start; flex-direction: column; } .toolbar-left { width: 100%; } .form-select { width: 100%; } .details { grid-template-columns: 1fr 1fr; } .photo-wrap { min-height: 210px; } }
  </style>
</head>
<body>
  <main class="page-shell">
    <header class="topbar">
      <div><p class="eyebrow">CSC &amp; Sewa Setu</p><h1>Branding QC Panel</h1><p>Review uploaded branding photos and record approval decisions.</p></div>
      <div class="brand-mark" aria-hidden="true">QC</div>
    </header>

    <section class="toolbar" aria-label="Queue controls">
      <div class="toolbar-left">
        <label for="statusFilter">Show</label>
        <select id="statusFilter" class="form-select" onchange="loadPage(1)">
          <option value="pending" selected>Pending review</option>
          <option value="all">All submissions</option>
          <option value="approved">Approved</option>
          <option value="rejected">Rejected</option>
        </select>
        <span id="summary" class="summary">Loading queue…</span>
      </div>
      <button id="refreshButton" class="btn-refresh" type="button" onclick="loadPage(currentPage)">↻ Refresh</button>
    </section>

    <div id="notice" class="notice" role="status" aria-live="polite"></div>
    <div id="queue" class="loading"><span class="spinner-border spinner-border-sm me-2" role="status"></span>Loading branding submissions…</div>
    <nav id="pager" class="pager" aria-label="Queue pages" style="display:none">
      <button id="previousButton" type="button" onclick="loadPage(currentPage - 1)">← Previous</button>
      <span id="pageLabel"></span>
      <button id="nextButton" type="button" onclick="loadPage(currentPage + 1)">Next →</button>
    </nav>
  </main>

  <iframe id="backendFrame" name="backendFrame" title="QC update response" style="display:none"></iframe>
  <script>
    const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbznxRi2TAlxOA1oZlwTBlylbW-KqQZap1fa5U2b-IZ65F3bjGPMQD1MiLZ7hadhZQe-/exec';
    let currentPage = 1;
    let totalPages = 1;
    let requestTimer = null;

    function loadJsonp(params, onSuccess, onError) {
      const script = document.createElement('script');
      const callback = '__qcCallback_' + Date.now() + Math.random().toString(36).slice(2);
      window[callback] = function(data) { delete window[callback]; script.remove(); onSuccess(data); };
      script.onerror = function() { delete window[callback]; script.remove(); if (onError) onError(); };
      const query = new URLSearchParams(Object.assign({}, params, { callback: callback, _: Date.now() }));
      script.src = BACKEND_URL + '?' + query.toString();
      document.body.appendChild(script);
    }

    function addDetail(parent, label, value) {
      const wrap = document.createElement('div'); wrap.className = 'detail';
      const key = document.createElement('span'); key.className = 'detail-label'; key.textContent = label;
      const val = document.createElement('span'); val.className = 'detail-value'; val.textContent = value || '—';
      wrap.append(key, val); parent.appendChild(wrap);
    }

    function makeCard(entry) {
      const card = document.createElement('article'); card.className = 'qc-card';
      const photoWrap = document.createElement('div'); photoWrap.className = 'photo-wrap';
      if (entry.photoUrl) {
        const img = document.createElement('img'); img.src = entry.photoUrl; img.alt = 'Branding photo submitted by ' + (entry.vleName || 'VLE'); img.loading = 'lazy';
        img.onerror = function() { img.remove(); const fallback = document.createElement('div'); fallback.className = 'photo-placeholder'; fallback.textContent = 'Photo preview unavailable. Open the original file instead.'; photoWrap.prepend(fallback); };
        photoWrap.appendChild(img);
        const open = document.createElement('a'); open.className = 'photo-open'; open.href = entry.photoLink || entry.photoUrl; open.target = '_blank'; open.rel = 'noopener noreferrer'; open.textContent = 'Open original ↗'; photoWrap.appendChild(open);
      } else {
        const fallback = document.createElement('div'); fallback.className = 'photo-placeholder'; fallback.textContent = 'No photo link found for this submission.'; photoWrap.appendChild(fallback);
      }
      const body = document.createElement('div'); body.className = 'card-body';
      const heading = document.createElement('div'); heading.className = 'card-heading';
      const headingText = document.createElement('div');
      const title = document.createElement('h2'); title.textContent = entry.cscId ? 'CSC ID: ' + entry.cscId : 'Branding submission';
      const sub = document.createElement('p'); sub.textContent = entry.vleName || 'VLE name not provided';
      headingText.append(title, sub);
      const status = (entry.status || 'Pending').trim();
      const badge = document.createElement('span'); badge.className = 'status-badge ' + status.toLowerCase(); badge.textContent = status;
      heading.append(headingText, badge);
      const details = document.createElement('div'); details.className = 'details';
      addDetail(details, 'Submitted', entry.timestamp);
      addDetail(details, 'Sewa Setu ID', entry.sewaSetuId);
      addDetail(details, 'Location', [entry.district, entry.block, entry.gpCity, entry.villageWard].filter(Boolean).join(' / '));
      addDetail(details, 'Type', entry.locationType);
      body.append(heading, details);
      if (entry.remark) { const oldRemark = document.createElement('div'); oldRemark.className = 'existing-remark'; oldRemark.textContent = 'Current remark: ' + entry.remark; body.appendChild(oldRemark); }
      const remarkLabel = document.createElement('label'); remarkLabel.className = 'remark-label'; remarkLabel.textContent = 'Rejection remark (required when rejecting)';
      const remark = document.createElement('textarea'); remark.className = 'remark-input'; remark.maxLength = 1000; remark.placeholder = 'Write the reason for rejection'; remark.value = entry.remark || '';
      const actions = document.createElement('div'); actions.className = 'card-actions';
      const approve = document.createElement('button'); approve.type = 'button'; approve.className = 'action-btn approve-btn'; approve.textContent = '✓ Approve';
      const reject = document.createElement('button'); reject.type = 'button'; reject.className = 'action-btn reject-btn'; reject.textContent = '✕ Reject';
      approve.onclick = function() { updateEntry(entry.row, 'Approved', '', card); };
      reject.onclick = function() { if (!remark.value.trim()) { remark.focus(); remark.setCustomValidity('Rejection remark is required.'); remark.reportValidity(); remark.setCustomValidity(''); return; } updateEntry(entry.row, 'Rejected', remark.value.trim(), card); };
      actions.append(approve, reject); body.append(remarkLabel, remark, actions);
      card.append(photoWrap, body); return card;
    }

    function loadPage(page) {
      currentPage = Math.max(1, page || 1);
      const queue = document.getElementById('queue');
      const filter = document.getElementById('statusFilter').value;
      const refresh = document.getElementById('refreshButton');
      refresh.disabled = true;
      queue.className = 'loading'; queue.textContent = 'Loading branding submissions…';
      document.getElementById('pager').style.display = 'none';
      loadJsonp({ action: 'qcList', page: currentPage, filter: filter }, function(data) {
        refresh.disabled = false;
        if (!data || !data.success) { queue.className = 'empty'; queue.textContent = (data && data.error) || 'Could not load submissions.'; return; }
        currentPage = data.page || 1; totalPages = data.pages || 1;
        document.getElementById('summary').textContent = (data.total || 0) + ' submission' + ((data.total || 0) === 1 ? '' : 's');
        queue.replaceChildren();
        if (!data.entries || !data.entries.length) { queue.className = 'empty'; queue.textContent = 'No submissions found in this queue.'; }
        else { queue.className = 'queue'; data.entries.forEach(function(entry) { queue.appendChild(makeCard(entry)); }); }
        const pager = document.getElementById('pager');
        pager.style.display = totalPages > 1 ? 'flex' : 'none';
        document.getElementById('pageLabel').textContent = 'Page ' + currentPage + ' of ' + totalPages;
        document.getElementById('previousButton').disabled = currentPage <= 1;
        document.getElementById('nextButton').disabled = currentPage >= totalPages;
      }, function() {
        refresh.disabled = false; queue.className = 'empty'; queue.textContent = 'Backend se queue load nahi ho saka. Refresh karke dobara try karein.';
      });
    }

    function showNotice(message, kind) {
      const box = document.getElementById('notice'); box.className = 'notice ' + kind; box.textContent = message;
    }

    function updateEntry(row, status, remark, card) {
      if (status === 'Approved' && !window.confirm('Is branding submission ko approve karein?')) return;
      if (status === 'Rejected' && !window.confirm('Is branding submission ko reject karein?')) return;
      card.querySelectorAll('button,textarea').forEach(function(el) { el.disabled = true; });
      showNotice('Status update ho raha hai…', 'success');
      const requestId = 'qc-' + ((window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2));
      const payload = { action: 'qcUpdate', requestId: requestId, row: row, status: status, remark: remark };
      const form = document.createElement('form'); form.method = 'POST'; form.action = BACKEND_URL; form.target = 'backendFrame'; form.style.display = 'none';
      const input = document.createElement('input'); input.type = 'hidden'; input.name = 'payload'; input.value = JSON.stringify(payload); form.appendChild(input); document.body.appendChild(form); form.submit(); form.remove();
      const deadline = Date.now() + 60000;
      pollUpdate(requestId, deadline);
      clearTimeout(requestTimer);
      requestTimer = setTimeout(function() { showNotice('Update ka response nahi mila. Sheet mein row status check karein.', 'error'); card.querySelectorAll('button,textarea').forEach(function(el) { el.disabled = false; }); }, 60000);
    }

    function pollUpdate(requestId, deadline) {
      loadJsonp({ action: 'status', id: requestId }, function(data) {
        if (data && data.ready && data.result) {
          clearTimeout(requestTimer);
          if (data.result.success) { showNotice(data.result.message, 'success'); setTimeout(function() { loadPage(currentPage); }, 700); }
          else { showNotice(data.result.message || 'Update failed.', 'error'); document.querySelectorAll('.qc-card button, .qc-card textarea').forEach(function(el) { el.disabled = false; }); }
        } else if (Date.now() >= deadline) {
          showNotice('Update ka response nahi mila. Sheet mein row status check karein.', 'error');
        } else { setTimeout(function() { pollUpdate(requestId, deadline); }, 2000); }
      }, function() {
        if (Date.now() >= deadline) showNotice('Backend response unavailable. Sheet mein row status check karein.', 'error');
        else setTimeout(function() { pollUpdate(requestId, deadline); }, 3000);
      });
    }

    window.onload = function() { loadPage(1); };
  </script>
</body>
</html>
