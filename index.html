<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS for clean styling -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body class="container py-4">

  <!-- Navigation Tabs -->
  <ul class="nav nav-tabs mb-4" id="portalTabs" role="tablist">
    <li class="nav-item" role="presentation">
      <button class="nav-link" id="tab1-btn" onclick="switchTab(event, 'tab1')">Records Portal</button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link active" id="tab2-btn" onclick="switchTab(event, 'tab2')">Status Check</button>
    </li>
  </ul>

  <!-- Tab 1: Records Portal (Aapka pehla tab) -->
  <div id="tab1" class="tab-content">
    <h3>Records Search Portal</h3>
    <p class="text-muted">Yahan aapka pehle wala records search portal ka content rahega.</p>
  </div>

  <!-- Tab 2: Status Check (Dusra tab jisme issue tha) -->
  <div id="tab2" class="tab-content active">
    <h3>CSC ID Status Check</h3>
    <hr>
    <div class="row g-3 align-items-center my-3">
      <div class="col-auto">
        <label for="statusCscId" class="col-form-label fw-bold">Enter CSC ID:</label>
      </div>
      <div class="col-auto">
        <input type="text" id="statusCscId" class="form-control" placeholder="CSC ID darj karein...">
      </div>
      <div class="col-auto">
        <button type="button" id="statusSearchBtn" class="btn btn-primary">Search</button>
      </div>
    </div>

    <!-- Results Container -->
    <div id="statusResult" class="mt-4"></div>
  </div>

  <script>
    // Tab Switching Logic
    function switchTab(event, tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      event.currentTarget.classList.add('active');
    }

    // Status Check Search Handler (Enter & Click Fixed)
    document.addEventListener('DOMContentLoaded', function() {
      const searchInput = document.getElementById('statusCscId');
      const searchBtn = document.getElementById('statusSearchBtn');
      const resultDiv = document.getElementById('statusResult');

      function triggerSearch() {
        const cscId = searchInput.value.trim();
        if (!cscId) {
          alert('Kripya pehle CSC ID darj karein.');
          searchInput.focus();
          return;
        }

        resultDiv.innerHTML = '<div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div>';

        // Google Apps Script function call
        google.script.run
          .withSuccessHandler(function(response) {
            if (response.success && response.data && response.data.length > 0) {
              let html = '<div class="table-responsive"><table class="table table-bordered table-striped"><thead><tr>';
              Object.keys(response.data[0]).forEach(key => {
                html += `<th>${key}</th>`;
              });
              html += '</tr></thead><tbody>';
              
              response.data.forEach(row => {
                html += '<tr>';
                Object.values(row).forEach(val => {
                  html += `<td>${val !== null ? val : ''}</td>`;
                });
                html += '</tr>';
              });
              html += '</tbody></table></div>';
              resultDiv.innerHTML = html;
            } else {
              resultDiv.innerHTML = '<div class="alert alert-warning">Is CSC ID se koi record nahi mila.</div>';
            }
          })
          .withFailureHandler(function(error) {
            resultDiv.innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
          })
          .searchCscId(cscId);
      }

      // 1. Click event on Search Button
      if (searchBtn) {
        searchBtn.addEventListener('click', triggerSearch);
      }

      // 2. Keydown event on Input Field (Enter key support)
      if (searchInput) {
        searchInput.addEventListener('keydown', function(event) {
          if (event.key === 'Enter') {
            event.preventDefault(); // Page refresh hone se roknne ke liye
            triggerSearch();
          }
        });
      }
    });
  </script>
</body>
</html>
