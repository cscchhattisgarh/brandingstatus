<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; padding-top: 30px; }
    .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
  </style>
</head>
<body class="container">

  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card p-4">
        <h3 class="mb-3 text-center text-primary">CSC ID Status & Record Lookup</h3>
        <hr>
        
        <!-- Search Form -->
        <div class="input-group mb-3">
          <input type="text" id="cscIdInput" class="form-control" placeholder="CSC ID darj karein (e.g. 123456...)">
          <button class="btn btn-primary" type="button" id="searchBtn">Search</button>
        </div>

        <!-- Loading Spinner -->
        <div id="loading" class="text-center my-3" style="display: none;">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>

        <!-- Result Container -->
        <div id="resultContainer" class="mt-3"></div>
      </div>
    </div>
  </div>

  <script>
    // ⚠️ IMPORTANT: Yahan apna deployed Google Apps Script Web App URL daalein agar ye Web App ki tarah run ho raha hai, 
    // ya agar ye google.script.run se chal raha hai toh niche fetch ki jagah wo use hoga.
    // Niche hum direct Web App URL fetch method use kar rahe hain jo aapke doGet(e) se match karta hai.
    
    const WEB_APP_URL = "Aapka_Web_App_URL_Yahan_Paste_Karein"; // Agar URL nahi hai toh niche alternative code dekhein

    document.addEventListener('DOMContentLoaded', function() {
      const inputField = document.getElementById('cscIdInput');
      const searchButton = document.getElementById('searchBtn');
      const resultDiv = document.getElementById('resultContainer');
      const loadingDiv = document.getElementById('loading');

      function performSearch() {
        const cscId = inputField.value.trim();
        if (!cscId) {
          alert('Kripya pehle CSC ID darj karein!');
          inputField.focus();
          return;
        }

        loadingDiv.style.display = 'block';
        resultDiv.innerHTML = '';

        // Agar aap Google Apps Script ke inside HTML service se run kar rahe hain aur Code.gs ke functions direct call karne hain:
        // Yahan hum google.script.run ka use karke direct backend function bhi call kar sakte hain bina Web App URL ke.
        
        // Alternative & Direct approach using google.script.run (Aapke Code.gs me lookup logic likhne ki zaroorat padegi, 
        // ya agar aapne doGet banaya hai toh fetch use hoga. Niche fetch ka standard tarika hai):
        
        // NOTE: Agar aapka script as a Web App deployed hai toh fetch use hoga:
        const targetUrl = `${WEB_APP_URL}?action=lookup&cscid=${encodeURIComponent(cscId)}`;

        fetch(targetUrl)
          .then(response => response.json())
          .then(data => {
            loadingDiv.style.display = 'none';
            if (data.success) {
              let html = `<div class="alert alert-success"><h5>VLE Profile Found</h5>
                          <p><b>Name:</b> ${data.profile.vleName}</p>
                          <p><b>District:</b> ${data.profile.district}</p>
                          <p><b>Mobile:</b> ${data.profile.mobileNo}</p></div>`;
              
              if(data.records && data.records.length > 0) {
                html += `<h5 class="mt-3">Records History</h5><table class="table table-bordered table-striped">
                         <thead><tr><th>Date</th><th>Block</th><th>Remark</th><th>Photo</th></tr></thead><tbody>`;
                data.records.forEach(rec => {
                  html += `<tr>
                            <td>${rec.date}</td>
                            <td>${rec.block}</td>
                            <td>${rec.remark}</td>
                            <td>${rec.photoLink ? `<a href="${rec.photoLink}" target="_blank">View</a>` : ''}</td>
                           </tr>`;
                });
                html += `</tbody></table>`;
              }
              resultDiv.innerHTML = html;
            } else {
              resultDiv.innerHTML = `<div class="alert alert-warning">Is CSC ID se koi record nahi mila.</div>`;
            }
          })
          .catch(error => {
            loadingDiv.style.display = 'none';
            resultDiv.innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
          });
      }

      // 1. Button Click Event
      searchButton.addEventListener('click', performSearch);

      // 2. Input Field Keydown Event (Enter Key Support Fixed!)
      inputField.addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
          event.preventDefault(); // Page reload hone se rokne ke liye
          performSearch();
        }
      });
    });
  </script>
</body>
</html>
